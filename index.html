<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="How to submit your hours and kilometres in Xero.">
<title>Xero Timesheet Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Overpass+Mono:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Same tokens, fonts and card style as the Dash Cam Drive Guide.
   Amber = do this / where to click. Coral = don't / attention. Sage = done / correct. */
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --ink:#141B3C; --muted:#5B6078; --line:#E2D9C8;
  --brand:#F2A93B; --brand-ink:#141B3C; --amber:#F2A93B; --coral:#D94A22; --sage:#5E8F88;
  --ok-bg:#E4EFEC; --bad-bg:#FBE7E0; --tint:#EFE7D7;
  /* the same in both themes */
  --navy:#141B3C; --cream:#F3EBDD; --white:#FFFDF8; --shot-bg:#FFFFFF;
  --amber-soft:rgba(242,169,59,.24); --amber-ring:rgba(242,169,59,.4); --amber-dot:rgba(242,169,59,.88);
  --scrim:rgba(10,14,34,.92); --shade:rgba(0,0,0,.45);
  --f-display:"Overpass","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1228; --surface:#171D3A; --ink:#F3EBDD; --muted:#A9AEC6; --line:#2B3359;
  --brand:#F2A93B; --brand-ink:#141B3C; --coral:#FF7A52; --sage:#7DB3AB;
  --ok-bg:#1C3537; --bad-bg:#3D2320; --tint:#1F2647; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1228; --surface:#171D3A; --ink:#F3EBDD; --muted:#A9AEC6; --line:#2B3359;
  --brand:#F2A93B; --brand-ink:#141B3C; --coral:#FF7A52; --sage:#7DB3AB;
  --ok-bg:#1C3537; --bad-bg:#3D2320; --tint:#1F2647; color-scheme:dark }

/* demo pointer (hand / eye) */
:root{--cur-f:#F2A93B;--cur-o:#141B3C;--cur-l:#B9791C}   /* amber with a navy outline, in both modes */
.cf{fill:var(--cur-f)} .co{fill:var(--cur-o)} .cl{fill:var(--cur-l)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
main,.peek{display:flex;flex-direction:column;gap:14px}
/* pages: swipe sideways to change step. The neighbour page (peek) is drawn beside the current one while the finger moves. */
.pager{position:relative;overflow:hidden}
@supports (overflow:clip){.pager{overflow:visible;overflow-x:clip}}
#view{touch-action:pan-y pinch-zoom}
.peek{position:absolute;left:0;top:0;width:100%;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* sticky header: top bar + step strip */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.where{flex:1;min-width:0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.where b,.where span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where b{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.theme,.helpbtn{height:44px;flex:none;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.theme{width:44px}
.theme svg{width:22px;height:22px}
.helpbtn{display:flex;align-items:center;padding:0 18px;border:2px solid var(--amber);color:var(--ink);
  font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1}
.helpbtn span{padding-top:2px}
.helpbtn[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}       /* on the Help page */

/* step strip: swipe sideways, tap any step to jump */
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 34px 4px 2px;
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 24px),transparent)}
.strip::-webkit-scrollbar{display:none}
/* arrows at the strip edges: show there is more, and scroll on click (for mouse users) */
.stripwrap{position:relative}
.sarrow{position:absolute;bottom:11px;width:28px;height:40px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 0 0 3px var(--bg)}
.sarrow svg{width:13px;height:13px}
.sarrow.l{left:0}
.sarrow.r{right:0}
/* finger that swipes left over the strip. Plays on every page load, like the other guide. */
.swipehint{position:absolute;right:22%;bottom:-14px;width:44px;height:54px;pointer-events:none;z-index:2}
.swipehint > *{position:absolute;opacity:0}
.finger{left:0;top:0;width:44px;height:54px}
.finger svg{width:100%;height:100%;display:block;overflow:visible}
/* dotted path: shows where the finger will go, with an arrow at the end */
.hpath{top:3px;right:24px;width:164px;height:6px;
  background:radial-gradient(circle,var(--amber) 2.2px,transparent 2.6px) right center/12px 6px repeat-x}
.hpath::before{content:"";position:absolute;left:-4px;top:-5px;width:11px;height:11px;border-left:3.5px solid var(--amber);border-bottom:3.5px solid var(--amber);transform:rotate(45deg);border-radius:2px}
/* solid trail: grows behind the finger as it moves */
.htrail{top:2px;right:24px;height:8px;width:0;border-radius:4px;background:linear-gradient(to right,var(--amber),transparent)}
.strip.anim{scroll-snap-type:none}
.finger .tip{fill:var(--amber);transform-box:fill-box;transform-origin:center;opacity:0}
.grp{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 8px 7px;border-radius:12px;scroll-snap-align:start}
.grp:nth-child(even){background:var(--tint)}
.grp > span{font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.grp.now > span{color:var(--ink)}
/* stage A is dimmed for people who already have an account; the chips still work */
.grp.skip{opacity:.45}
.chips{display:flex;gap:5px}
.strip.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.strip.drag .chip{cursor:grabbing}
@media (hover:hover) and (pointer:fine){.strip{cursor:grab}}
.chip{min-width:44px;height:40px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  font-family:var(--f-mono);font-weight:600;font-size:14px;display:grid;place-items:center}
.chip.seen{border-color:var(--sage)}
.chip[aria-current="step"]{background:var(--amber);border-color:var(--amber);color:var(--navy)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.head,.rest,.fig{display:flex;flex-direction:column;gap:14px;min-width:0}
.rest:empty{display:none}
.stage{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--amber);border-radius:999px;padding:5px 12px 3px}
.stage em{font-style:normal;font-family:var(--f-mono);margin-right:6px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.12;text-wrap:balance}
h1:focus{outline:none}
h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.2}
.lead{margin:0;font-size:18px}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.pts li{position:relative;padding-left:30px}
ul.pts li::before{content:"";position:absolute;left:5px;top:.62em;width:12px;height:4px;border-radius:2px;background:var(--amber)}
ul.pts li.no::before{background:var(--coral)}
/* numbered point = same number as the mark drawn on the screenshot */
ul.pts li.num::before{content:attr(data-n);left:0;top:.08em;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--navy);
  font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;display:grid;place-items:center;padding-top:1px}
/* small jump button inside a point */
.inl{display:inline-flex;align-items:center;gap:5px;vertical-align:baseline;margin-left:2px;cursor:pointer;border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);
  font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.2;padding:5px 12px 3px}
.inl svg{width:10px;height:10px}
.rate{font-family:var(--f-mono);font-weight:600;font-size:15px;background:var(--tint);border-radius:6px;padding:1px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.box{border-radius:12px;padding:12px 14px;margin:0;font-size:16px}
.box b{display:block;font-family:var(--f-display);font-weight:800}
.box.warn{background:var(--bad-bg);border-left:4px solid var(--coral)}
.box.ok{background:var(--ok-bg);border-left:4px solid var(--sage)}
.box.todo{border:1.5px dashed var(--coral);color:var(--coral);font-family:var(--f-display);font-weight:800;font-size:14px}
.note{font-size:15px;color:var(--muted);margin:0}

/* screenshot frame with drawn marks */
.shot{position:relative;margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--shot-bg);cursor:zoom-in;padding:0;display:block;width:100%;text-align:left}
.shot img{display:block;width:100%;height:auto}
.shot.gl{padding-left:30px;background:var(--tint)}
.shot.gr{padding-right:30px}
.pic{position:relative;display:block;background:var(--tint)}   /* shows through the gaps between pieces */
.pic img{display:block;width:100%;height:auto}
/* Placeholder: drawn in the space the picture will take, so nothing moves when the picture arrives.
   The space comes from the picture's own size (SIZES below), set on the <img> before it downloads. */
.pic img{opacity:0;transition:opacity .25s}
.pic.ready img{opacity:1}
.pic:not(.ready) .mark,.pic:not(.ready) .badge{opacity:0}
.load{position:absolute;inset:0;z-index:1;display:grid;place-items:center;overflow:hidden;background:var(--tint);container-type:size;transition:opacity .25s,visibility .25s}
.pic.ready .load{opacity:0;visibility:hidden}
.ph{position:relative;display:block;aspect-ratio:16/10}
.ph .load{position:absolute}
.ld-cap{font-family:var(--f-display);font-weight:800;font-size:min(13px,11cqh);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ld-code{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
/* A: skeleton of a screen. The bars keep growing and shrinking one after another, and a light sweeps across: still loading. */
.ld-a{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;justify-content:center;gap:min(12px,9cqh)}
.ld-a i{display:block;height:min(14px,10cqh);border-radius:6px;background:var(--line);transform-origin:left center;animation:bar 1.6s ease-in-out infinite}
.ld-a i:nth-child(1){width:55%} .ld-a i:nth-child(2){width:88%;animation-delay:.2s} .ld-a i:nth-child(3){width:72%;animation-delay:.4s} .ld-a i:nth-child(4){width:38%;background:var(--amber-soft);animation-delay:.6s}
@keyframes bar{0%,100%{transform:scaleX(.55);opacity:.55}50%{transform:scaleX(1);opacity:1}}
.ld-a::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--surface) 50%,transparent 70%);opacity:.6;transform:translateX(-100%);animation:sheen 1.8s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
/* B: flat clip-art of a browser window with a picture in it */
.ld-b{display:flex;flex-direction:column;align-items:center;gap:min(8px,5cqh);height:100%;justify-content:center}
.ld-b svg{height:min(110px,62cqh);width:auto;display:block}
.ld-b .w{fill:var(--surface)} .ld-b .f{fill:var(--line)} .ld-b .d{fill:var(--muted)} .ld-b .h{fill:var(--sage)} .ld-b .h2{fill:var(--muted);opacity:.55} .ld-b .s{fill:var(--amber)}
.ld-b .s{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
/* C: step code and three dots */
.ld-c{display:flex;flex-direction:column;align-items:center;gap:min(8px,5cqh)}
.ld-c .ld-code{font-size:min(34px,26cqh);line-height:1}
.ld-c .dots{display:flex;gap:min(8px,4cqh)}
.ld-c .dots i{width:min(10px,7cqh);height:min(10px,7cqh);border-radius:50%;background:var(--amber);animation:dot 1.2s ease-in-out infinite}
.ld-c .dots i:nth-child(2){animation-delay:.2s} .ld-c .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.mark{position:absolute;border:2.5px solid var(--amber);border-radius:6px;pointer-events:none}
.mark.no{border-color:var(--coral)}
.badge{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--navy);
  font-family:var(--f-display);font-weight:800;font-size:13px;display:grid;place-items:center;line-height:1;pointer-events:none}
.badge.l{left:-26px}
.badge.r{right:-26px}
.badge.no{background:var(--coral);color:var(--white)}
.shot .ex{position:absolute;top:8px;right:8px;background:var(--navy);color:var(--white);font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px 3px;border-radius:6px;pointer-events:none}
.cap{font-size:13px;color:var(--muted);margin:-6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cap .tag{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:3px 7px 1px}
.cap .tap{margin-left:auto}
/* Play: easy to see (amber ring + amber disc), but lighter than Next, which stays the one filled button on the page */
.play{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;border:2px solid var(--amber);border-radius:999px;background:var(--surface);color:var(--ink);
  font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1;padding:4px 16px 4px 6px}
.play svg{width:28px;height:28px;flex:none}
.play span{padding-top:2px}
.play .pb{fill:var(--brand)} .play .pi{fill:var(--brand-ink)}
.play:disabled{opacity:.4;cursor:default}      /* picture not downloaded yet */

/* demo: a pointer visits mark 1, 2, 3. Eye = check this. Hand = change or type here. Hand that presses = click.
   The visited box and its text point light up. */
.cur{position:absolute;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none;opacity:0;
  transition:transform .8s cubic-bezier(.45,0,.2,1),opacity .3s}
.cur .g{position:absolute;display:none}
.cur .hand{left:-11px;top:-2px;width:34px;height:42px}     /* index finger tip sits on the target point */
.cur .eye{left:-19px;top:-13px;width:38px;height:27px}     /* eye centre sits on the target point */
.cur svg{width:100%;height:100%;display:block;overflow:visible}
.cur.k-look .eye,.cur.k-edit .hand,.cur.k-click .hand{display:block}
.cur .hand svg{transition:transform .18s;transform-origin:38% 10%}
.cur.press .hand svg{transform:scale(.84)}
.cur i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--amber);opacity:0}
.cur.press i{animation:ring .45s ease-out}
@keyframes ring{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.cur.k-look .eye svg{animation:blink 1.7s ease-in-out infinite}
@keyframes blink{0%,40%,60%,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}
.cur.k-edit .hand svg{animation:typing .55s ease-in-out infinite}
@keyframes typing{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.mark{transition:opacity .25s,background .25s,box-shadow .25s}
.mark.dim{opacity:.25}
.mark.on{background:var(--amber-soft);box-shadow:0 0 0 3px var(--amber-ring)}
.badge{transition:opacity .25s,transform .25s}
.badge.dim{opacity:.3}
.badge.on{transform:scale(1.25)}
ul.pts li{transition:background .25s,box-shadow .25s;border-radius:6px}
ul.pts li.on{background:var(--amber-soft);box-shadow:0 0 0 6px var(--amber-soft)}   /* amber tint: visible on the cream card and on the night card */

/* choice buttons (start page) */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;cursor:pointer;background:var(--bg);border:2px solid var(--amber);border-radius:12px;padding:13px 16px 12px;line-height:1.35}
.choice b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px}
.choice span span{display:block;color:var(--muted);font-size:15px}
.choice svg{width:15px;height:15px}
.choice.main{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.choice.main span span{color:inherit;opacity:.85}

/* key points on the start page */
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.keys li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.keys .n{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.keys b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.25}
.keys span{display:block;color:var(--muted);font-size:15px}

/* help list */
.faq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.faq button{width:100%;text-align:left;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.faq b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.3}
.faq span{display:block;font-size:14px;color:var(--muted)}
.faq i{font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:13px;border:1.5px solid var(--amber);border-radius:8px;padding:3px 7px 1px}

/* bottom nav */
.nav{display:flex;gap:10px}
.nav button{font-family:var(--f-display);font-weight:800;font-size:17px;border-radius:12px;padding:12px 16px 10px;cursor:pointer}
.nav .ar{width:14px;height:14px;flex:none}
.prev{background:transparent;border:1.5px solid var(--line);display:flex;align-items:center;gap:8px}
.next{flex:1;min-width:0;border:0;background:var(--amber);color:var(--navy);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;line-height:1.2;text-align:left}
.next .top{display:flex;align-items:center;gap:8px;font-size:20px;line-height:1.15}
.next small{font-family:var(--f-body);font-weight:400;font-size:14px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* zoom view */
.zoom{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.zoom .zbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--cream);font-family:var(--f-display);font-weight:800}
.zoom .zbar button{background:var(--cream);color:var(--navy);border:0;border-radius:999px;padding:10px 18px 8px;font-family:var(--f-display);font-weight:800;cursor:pointer}
.zoom .zbar .zb{width:44px;padding:10px 0 8px;font-size:18px;line-height:1}
.zbtns{display:flex;gap:8px}
/* the whole picture is visible when it opens. Pinch, wheel or + / - to zoom. Drag to move. */
.zoom .zin{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.zoom .zin .shot{max-width:none;cursor:inherit;pointer-events:none;will-change:transform}
.zhint{position:absolute;inset:0;z-index:2;pointer-events:none}
/* finger marks: one per finger, drawn on top of the picture */
.zd{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;opacity:0;
  background:var(--amber-dot);border:3px solid var(--white);box-shadow:0 2px 10px var(--shade),0 0 0 7px var(--amber-ring)}
.zcap{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--navy);color:var(--white);border:1.5px solid var(--amber);border-radius:999px;
  padding:8px 16px 6px;font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap}

/* page swipe hint (touch screens, first step page of a visit): a hand drags the page sideways and it springs back */
.pic img.after,.pic.ready img.after{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
.pic.swapped img.after{opacity:1}
.pic.swapped .mark[data-n="2"]{animation:chg 1s .5s 2}
@keyframes chg{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--amber) 50%,transparent)}}
.sbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;width:48px;height:48px;margin-left:-24px;padding:0;
  display:grid;place-items:center;border-radius:50%;border:2px solid var(--amber);color:var(--ink);cursor:pointer;
  background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s,transform .2s,visibility 0s .2s}
.sbar.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.sbar svg{width:16px;height:16px;transform:rotate(90deg)}
.phint .cn{fill:var(--brand-ink);opacity:.16}
.phint{position:fixed;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .25s}
.phint.on{opacity:1}
.phint .phand{position:absolute;left:-22px;top:-6px;width:58px;height:64px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.phint .phand svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .18s;transform-origin:38% 10%}
.phint.press .phand svg{transform:scale(.85)}
.phint .phcap{position:absolute;left:0;top:-54px;transform:translateX(-50%);white-space:nowrap;background:var(--brand);color:var(--brand-ink);
  border-radius:999px;padding:8px 14px 6px;font-family:var(--f-display);font-weight:800;font-size:15px}

/* new page slides in from the side it came from */
#view.inR{animation:inR .22s ease-out}
#view.inL{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(30px);opacity:.25}}
@keyframes inL{from{transform:translateX(-30px);opacity:.25}}

/* computer / iPad landscape: screenshot on the left, large; text on the right */
@media (min-width:900px){
  .wrap{max-width:1120px}
  main > *,.peek > *{width:100%;max-width:600px;margin-inline:auto}
  main > .card.wide,.peek > .card.wide{max-width:none;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:26px;row-gap:14px;align-items:start}
  .card.wide .fig{grid-column:1;grid-row:1 / 3}
  .card.wide .fig .shot{max-width:calc(var(--ar, 9) * 460px + 30px);margin-inline:auto}   /* tall pictures (D2) stay at most 460 px high */
  .card.wide .head{grid-column:2;grid-row:1}
  .card.wide .rest{grid-column:2;grid-row:2}
}

const FAQ = [   // most common first

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER = ['start', ...STEPS.map(s => s.id), 'help'];
const seen = new Set();

/* People who used Xero for Matrix before skip stage A.
   Then Next / Previous / "x of y" leave stage A out. Kept for this visit only: nothing is stored. */
const A_IDS = STEPS.filter(s => s.g === FIRST_TIME).map(s => s.id);
let skipA = false;
function setSkip(v){ skipA = v; }
const order = () => skipA ? ORDER.filter(id => !A_IDS.includes(id)) : ORDER;

const NARROW = matchMedia('(max-width: 899px)');

const pick = (s, full) => (full && s.fsrc) ? {src:s.fsrc, marks:s.fmarks || [], ex:s.ex}
  : (!full && NARROW.matches && s.nsrc) ? {src:s.nsrc, marks:s.nmarks || [], close:true, ex:s.ex}
  : {src:s.src, marks:s.marks || [], ex:s.ex};
function loadArt(code){
  const k = CFG.placeholder;
  if (k === 'A') return `<span class="ld-a"><i></i><i></i><i></i><i></i></span>`;
  if (k === 'C') return `<span class="ld-c"><span class="ld-code">${code}</span><span class="dots"><i></i><i></i><i></i></span><span class="ld-cap">Loading picture</span></span>`;
  return `<span class="ld-b"><svg viewBox="0 0 120 84" aria-hidden="true"><rect class="f" x="0" y="0" width="120" height="84" rx="9"/><rect class="w" x="5" y="15" width="110" height="64" rx="4"/><circle class="d" cx="11" cy="8" r="2.6"/><circle class="d" cx="19" cy="8" r="2.6"/><circle class="d" cx="27" cy="8" r="2.6"/><path class="h2" d="M5 79 L5 62 L38 40 L62 56 L72 50 L115 76 L115 79 Z"/><path class="h" d="M5 79 L36 54 L58 70 L80 52 L115 79 Z"/><circle class="s" cx="88" cy="32" r="8"/></svg><span class="ld-cap">Loading picture</span></span>`;

function shotHTML(s, code, full){
  const v = pick(s, full), src = v.src;   // no src = placeholder only, with the description

    ? `<img src="${esc(src)}" alt="Screenshot ${code}: ${esc(s.what)}"${sz ? ` width="${sz[0]}" height="${sz[1]}" style="aspect-ratio:${sz[0]}/${sz[1]}"` : ''} decoding="async"><span class="load" aria-hidden="true">${loadArt(code)}</span>`
    : `<span class="ph" role="img" aria-label="Placeholder for screenshot ${code}: ${esc(s.what)}"><span class="load">${loadArt(code)}</span></span>`;
  const st = STEPS.find(x => x.id === code), aft = !full && src && st && st.after ? (src === s.nsrc ? st.after.nsrc : st.after.src) : '';
  const after = aft ? `<img class="after" src="${esc(aft)}" alt="" aria-hidden="true" decoding="async">` : '';
  const ms = v.marks;
  // Boxes sit on the screenshot. Numbers sit in a gutter beside it, level with their box,
  // so a number never covers the screenshot and a box line never crosses a number.
  const boxes = ms.map(m => `<span class="mark${m.no?' no':''}" data-n="${m.n || m.g || ''}"${m.act ? ` data-act="${m.act}"` : ''}${m.tx != null ? ` data-tx="${m.tx}" data-ty="${m.ty}"` : ''} style="left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%"></span>`).join('');
  const badges = ms.filter(m => m.n).map(m => `<b class="badge ${m.side==='r'?'r':'l'}${m.no?' no':''}" data-c="${(m.y + m.h/2).toFixed(2)}" style="top:clamp(0px, calc(${(m.y + m.h/2).toFixed(1)}% - 11px), calc(100% - 22px))">${m.n}</b>`).join('');

}
function gutters(s, full){ const ms = s ? pick(s, full).marks : []; return (ms.length ? ' gl' : '') + (ms.some(m => m.side === 'r') ? ' gr' : ''); }

/* Numbers on the same side must not overlap: keep them level with their box, but at least 24 px apart. */
function spreadBadges(root){
  (root || document).querySelectorAll('.pic').forEach(pic => {
    const H = pic.clientHeight; if (!H) return;
    ['l','r'].forEach(side => {
      const bs = [...pic.querySelectorAll('.badge.' + side)];
      // wanted position: centred on its box (data-c = box centre, % of the picture height)
      const items = bs.map(b => ({b, y: parseFloat(b.dataset.c) / 100 * H - 11})).sort((a, c) => a.y - c.y);
      const GAP = 24, SZ = 22;
      for (let k = 1; k < items.length; k++) items[k].y = Math.max(items[k].y, items[k-1].y + GAP);
      for (let k = items.length - 1; k >= 0; k--) {               // keep inside the picture
        const lim = (k === items.length - 1 ? H - SZ : items[k+1].y - GAP);
        items[k].y = Math.max(0, Math.min(items[k].y, lim));
      }
      items.forEach(it => it.b.style.top = it.y + 'px');
    });
  });
}
function watchPics(root){
  // The placeholder stays until the picture is downloaded; a picture that fails keeps its placeholder.
  (root || document).querySelectorAll('.pic img:not(.after)').forEach(img => {
    const done = () => { if (img.naturalWidth > 0) img.closest('.pic').classList.add('ready'); spreadBadges(img.closest('.pic').parentNode); };
    if (img.complete) done(); else img.addEventListener('load', done, {once:true});
  });
  spreadBadges(root);
}
window.addEventListener('resize', () => spreadBadges());

/* ---------- strip ---------- */
function buildStrip(){

  STAGES.forEach((st,i) => groups.push({name:`${st.k} · ${st.name}`, ids:STEPS.filter(s=>s.g===i).map(s=>s.id), g:i}));
  $('#strip').innerHTML = groups.map(gr => `<div class="grp" data-g="${gr.g ?? ''}"><span>${esc(gr.name)}</span><div class="chips">${
    gr.ids.map(id => { const st = STEPS.find(s => s.id === id);
      return `<button class="chip" type="button" data-to="${id}" aria-label="Go to ${st ? 'step '+id+': '+esc(st.t) : id}"${st ? ` title="${esc(st.t)}"` : ''}>${(gr.label&&gr.label[id]) || id}</button>`; }).join('')
  }</div></div>`).join('');
  $('#strip').addEventListener('click', e => { const b = e.target.closest('[data-to]'); if (b) go(b.dataset.to); });
}
function syncStrip(id){
  const step = STEPS.find(s => s.id === id);

/* strip arrows + first-visit hint that the strip scrolls sideways */
const strip = $('#strip');
function syncArrows(){
  const max = strip.scrollWidth - strip.clientWidth;
  $('#sl').hidden = strip.scrollLeft <= 4;
  $('#sr').hidden = strip.scrollLeft >= max - 4;
}
strip.addEventListener('scroll', syncArrows, {passive:true});
window.addEventListener('resize', syncArrows);
$('#sl').addEventListener('click', () => strip.scrollBy({left:-strip.clientWidth * .7, behavior:'smooth'}));
$('#sr').addEventListener('click', () => strip.scrollBy({left: strip.clientWidth * .7, behavior:'smooth'}));
/* mouse: press and drag the strip sideways. A drag does not count as a click on a step. */
let dragX = null, dragLeft = 0, dragged = false;
strip.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  dragX = e.clientX; dragLeft = strip.scrollLeft; dragged = false;
});
window.addEventListener('pointermove', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  if (!dragged && Math.abs(dx) > 5) { dragged = true; strip.classList.add('drag'); }
  if (dragged) { strip.scrollLeft = dragLeft - dx; e.preventDefault(); }
});
window.addEventListener('pointerup', () => {
  if (dragX === null) return;
  dragX = null; strip.classList.remove('drag');
  setTimeout(() => { dragged = false; }, 0);           // the click comes right after pointerup
});
strip.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
strip.addEventListener('dragstart', e => e.preventDefault());

function hintStrip(){
  if (matchMedia('(pointer: coarse)').matches) return;   // computers only; touch screens get the page swipe hint
  // Plays on every page load (refresh included). Skipped only when the strip does not scroll.
  const max = strip.scrollWidth - strip.clientWidth;
  if (max <= 4) return;
  const h = $('#hint'), f = $('#finger'), tip = f.querySelector('.tip'), path = h.querySelector('.hpath'), trail = h.querySelector('.htrail');
  const base = strip.scrollLeft;
  const dist = Math.max(40, Math.min(140, max - base));  // finger and strip move the same distance
  const CYCLE = 1800, TIMES = 2;
  stripHintEnd = performance.now() + CYCLE * TIMES;
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  // value that goes from a to b between p0 and p1 (eased), flat outside
  const seg = (p, p0, p1, a, b) => p <= p0 ? a : p >= p1 ? b : a + (b - a) * ease((p - p0) / (p1 - p0));
  let raf = 0, t0 = 0, stopped = false;
  const hide = () => { [f, path, trail].forEach(el => el.style.opacity = 0); tip.style.opacity = 0; strip.classList.remove('anim'); };
  const stop = () => { if (stopped) return; stopped = true; cancelAnimationFrame(raf); hide(); };
  ['pointerdown','touchstart','wheel'].forEach(ev => strip.addEventListener(ev, stop, {once:true, passive:true}));
  function frame(now){
    if (stopped) return;
    if (!t0) t0 = now;
    const el = now - t0;
    if (el >= CYCLE * TIMES) { strip.scrollLeft = base; stop(); return; }
    const p = (el % CYCLE) / CYCLE;
    const x = p < .82 ? seg(p, .22, .70, 0, dist) : dist;          // how far the finger has moved
    f.style.opacity = p < .12 ? seg(p, 0, .12, 0, 1) : seg(p, .82, 1, 1, 0);
    const sc = p < .5 ? seg(p, .12, .22, 1, .88) : seg(p, .70, .82, .88, 1);
    f.style.transform = `translateX(${-x}px) scale(${sc})`;
    tip.style.opacity = p < .5 ? seg(p, .18, .24, 0, .9) : seg(p, .70, .80, .9, 0);
    tip.style.transform = `scale(${p < .5 ? seg(p, .18, .24, .4, 1) : seg(p, .70, .80, 1, 1.4)})`;
    path.style.opacity = p < .5 ? seg(p, 0, .10, 0, .75) : seg(p, .78, .96, .75, 0);
    trail.style.width = x + 'px';
    trail.style.opacity = seg(p, .82, 1, 1, 0);
    // the strip moves exactly with the finger, then slides back after the finger lifts
    strip.scrollLeft = base + (p < .82 ? x : seg(p, .82, 1, dist, 0));
    raf = requestAnimationFrame(frame);
  }
  strip.classList.add('anim');
  raf = requestAnimationFrame(frame);
}

  + '<span class="g eye"><svg viewBox="0 -1 44 32" aria-hidden="true"><path class="co" d="M0 15 C10 -1 34 -1 44 15 C34 31 10 31 0 15 Z"/><path class="cf" d="M2.5 15 C11 2.5 33 2.5 41.5 15 C33 27.5 11 27.5 2.5 15 Z"/><path class="co" d="M7 15 C13 7 31 7 37 15 C31 23 13 23 7 15 Z"/><circle class="cf" cx="22" cy="15" r="6.5"/><circle class="co" cx="24.3" cy="12.7" r="2"/></svg></span><i></i>';
let demoT = [];
function stopDemo(){
  demoT.forEach(clearTimeout); demoT = [];
  document.querySelectorAll('.cur').forEach(h => h.remove());
  document.querySelectorAll('.on,.dim').forEach(e => e.classList.remove('on','dim'));

function playDemo(){
  stopDemo();

  if (!ns.length) return;

  // eye: on the bottom edge of the box. edit: inside the box, left part. click: the middle of the box, which must be
  // drawn tight around the button. A mark can name its own point with tx / ty (% of the picture).
  const place = (bx, kind) => { const L = bx.offsetLeft, T = bx.offsetTop, W = bx.offsetWidth, H = bx.offsetHeight, P = bx.parentNode;

    return kind === 'look' ? [L + W / 2, T + H + 3] : kind === 'edit' ? [L + W * .3, T + H * .6] : [L + W / 2, T + H / 2]; };

  let t = 250, stop = 0, swapped = false;
  const swap = !!pic.querySelector('img.after');      // B3: the click switches the picture to week 2
  ns.forEach(n => {
    const group = marks.filter(m => m.dataset.n === n);
    group.forEach((bx, i) => {
      const kind = bx.dataset.act || 'look', first = stop++ === 0;

        marks.forEach(m => { m.classList.toggle('on', m.dataset.n === n); m.classList.toggle('dim', m.dataset.n !== n); });

/* Runs fn once the step's picture is downloaded, decoded and has a size on the page.
   Nothing happens before that: the demo needs the picture to know where the marks are. */
function whenPicReady(pic, fn){
  const img = pic && pic.querySelector('img:not(.after)'); if (!img) return;
  let tries = 0;
  const check = () => {
    if (!img.isConnected) return;                                     // the person already left this step
    if (img.complete && img.naturalWidth > 0 && pic.clientHeight > 0) { fn(); return; }
    if (tries++ < 600) requestAnimationFrame(check);                  // loaded but not laid out yet: look again next frame
  };
  const start = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(check);
  if (img.complete && img.naturalWidth > 0) start(); else img.addEventListener('load', start, {once:true});
}
/* Play stays switched off until the picture is ready. auto = also start the demo by itself (first visit to the step).

function autoPlay(){ if (phT || phRaf) { demoT.push(setTimeout(autoPlay, 300)); return; } playDemo(); }   // after the page hint
function armDemo(auto){
  const pic = $('#view .pic'), btn = $('#view [data-play]');
  whenPicReady(pic, () => {
    if (btn) btn.disabled = false;
    if (auto) demoT.push(setTimeout(autoPlay, 400));
  });
}

    const left = stripHintEnd - performance.now();
    if (left > 0) { phT = setTimeout(start, left + 300); return; }   // one animation at a time
    const {prev, next} = neighbours(current), dir = next ? -1 : prev ? 1 : 0;
    if (!dir) return;
    sw = {drag:true, hint:true, dir:0, to:null}; swPeek(dir);
    const W = view.offsetWidth, D = dir * Math.min(W * .42, 170), x0 = innerWidth * (dir < 0 ? .7 : .3), y = innerHeight * .58;
    const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    const seg = (p, a, b) => p <= a ? 0 : p >= b ? 1 : ease((p - a) / (b - a));
    const DUR = 2800; let t0 = 0;
    PH.classList.add('on');
    const frame = now => {
      if (!t0) t0 = now;
      const p = (now - t0) / DUR;
      if (p >= 1) { stopPageHint(); return; }
      const dx = D * (seg(p, .2, .6) - seg(p, .72, .92));          // drag, hold, spring back
      PH.classList.toggle('press', p > .14 && p < .7);
      PH.style.opacity = p < .1 ? p / .1 : p > .9 ? (1 - p) / .1 : 1;
      PH.style.transform = `translate(${x0 + dx}px,${y}px)`;
      swMove(dx, false);

    };
    phRaf = requestAnimationFrame(frame);
  };

}
window.addEventListener('touchstart', () => { if (phT || phRaf) stopPageHint(); }, {capture:true, passive:true});

/* ---------- touch screens: a round down arrow while the page goes on below the screen.
   Tap: scroll down most of a screen (on Start: to the "Used Xero for Matrix before?" question). ---------- */
const SB = document.createElement('button'); SB.type = 'button'; SB.className = 'sbar';
SB.setAttribute('aria-label', 'Scroll down');
SB.innerHTML = AR;
document.body.appendChild(SB);
function syncStartBar(){
  let on = TOUCH && document.documentElement.scrollHeight - (window.scrollY + innerHeight) > 80;
  const q = current === 'start' && $('#view .ask .choices');
  if (on && q) { const r = q.getBoundingClientRect(); if (r.top + r.height / 2 < innerHeight) on = false; }   // the choice is on screen
  SB.classList.toggle('show', on);
}
window.addEventListener('scroll', syncStartBar, {passive:true});
window.addEventListener('resize', syncStartBar);
if (document.fonts) document.fonts.ready.then(syncStartBar);
SB.addEventListener('click', () => {
  const q = current === 'start' && $('#view .ask');
  if (q) q.scrollIntoView({behavior:'smooth', block:'center'});
  else window.scrollBy({top: innerHeight * .7, behavior:'smooth'});
});

/* ---------- routing (#start, #A1, #help ...) ---------- */
let current = null, started = false;
function render(id, quiet, keep){   // keep = stay at the same scroll height (after a swipe)
  if (!ORDER.includes(id)) id = 'start';
  // Opening a stage A step means the person needs it: stop skipping.
  if (skipA && A_IDS.includes(id)) setSkip(false);
  stopDemo();
  const was = current, fresh = !seen.has(id);
  current = id; seen.add(id);
  const s = STEPS.find(x => x.id === id);
  $('#view').classList.remove('inR','inL');
  $('#view').innerHTML = pageHTML(id);
  const list = STEPS.filter(x => order().includes(x.id));
  $('#count').textContent = id === 'start' ? 'Start' : id === 'help' ? 'Help' : `${id} · ${list.indexOf(s)+1} of ${list.length}`;
  syncStrip(id);
  if (id === 'help') $('#helpBtn').setAttribute('aria-current', 'page'); else $('#helpBtn').removeAttribute('aria-current');
  if (!quiet && was && was !== id && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = $('#view'); v.classList.remove('inR','inL'); void v.offsetWidth;
    v.classList.add(ORDER.indexOf(id) > ORDER.indexOf(was) ? 'inR' : 'inL');
  }
  watchPics($('#view')); started = true;
  stopPageHint();
  if ((s || id === 'start') && TOUCH && !pageHintDone) pageHint();   // before the demo, which waits for it
  requestAnimationFrame(syncStartBar);
  if (s && s.anim) armDemo(fresh);           // Play switches on when the picture is ready; plays by itself on the first visit only
  if (!keep) window.scrollTo(0,0);   // Next / Previous / strip: start at the top of the new page
  const h = $('#view h1'); if (h) h.focus({preventScroll:true});
  if (location.hash.slice(1) !== id) { try { history.replaceState(null, '', '#' + id); } catch(e) {} }
}
function go(id){ render(id); }

$('#view').addEventListener('click', e => {
  const pb = e.target.closest('[data-play]');
  if (pb) { if (!pb.disabled) playDemo(); return; }
  const b = e.target.closest('[data-to]');
  if (b) {
    if (b.dataset.skip !== undefined) setSkip(b.dataset.skip === '1');
    go(b.dataset.to); return;
  }
  const z = e.target.closest('[data-zoom]');
  if (z) openZoom(z.dataset.zoom);
});
$('#helpBtn').addEventListener('click', () => go('help'));
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) go(id); });

/* ---------- swipe the page left / right to change step (touch only; up / down still scrolls).
   The page moves with the finger. The next / previous page comes in beside it, so you see how far you are. ---------- */
const view = $('#view'), peek = $('#peek'), PGAP = 16;
const pageHTML = id => id === 'start' ? startView() : id === 'help' ? helpView() : stepView(STEPS.find(x => x.id === id));
let sw = null;
function swMove(dx, anim){
  const tr = anim ? 'transform .22s ease-out' : 'none';
  view.style.transition = tr; peek.style.transition = tr;
  view.style.transform = dx ? `translateX(${dx}px)` : '';
  if (!peek.hidden) peek.style.transform = `translateX(${dx + (sw.dir < 0 ? 1 : -1) * (view.offsetWidth + PGAP)}px)`;
}
function swPeek(dir){                                     // dir -1 = finger moves left = next page
  const {prev, next} = neighbours(current);
  let to = dir < 0 ? next : prev;
  if (current === 'start' && dir < 0) to = 'A1';         // on Start, a swipe means "first time" (the path with every step); returning users tap Yes
  sw.dir = dir; sw.to = to;
  if (!to) { peek.hidden = true; peek.innerHTML = ''; return; }
  peek.innerHTML = pageHTML(to); peek.hidden = false;
  // the neighbour is drawn at the same height as the current page, and the reader stays at the same height after the change
  peek.style.top = '0px';
  watchPics(peek);
}
function swEnd(done){
  const s = sw; sw = null;
  const finish = () => { view.style.transition = peek.style.transition = 'none'; view.style.transform = ''; peek.hidden = true; peek.innerHTML = ''; peek.style.transform = ''; };
  if (!s || !s.drag) { finish(); return; }
  sw = s;                                                 // swMove reads sw.dir
  if (done && s.to) {
    swMove((s.dir < 0 ? -1 : 1) * (view.offsetWidth + PGAP), true); sw = null;
    setTimeout(() => { const y = window.scrollY; finish(); render(s.to, true, true); window.scrollTo(0, y); }, 230);
  } else { swMove(0, true); sw = null; setTimeout(finish, 230); }
}
document.getElementById('pager').addEventListener('touchstart', e => {
  if (sw && sw.drag) return;
  sw = e.touches.length === 1 ? {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(), lx:e.touches[0].clientX, lt:Date.now(), v:0, drag:false, dir:0, to:null} : null;
}, {passive:true});
document.getElementById('pager').addEventListener('touchmove', e => {
  if (!sw || e.touches.length !== 1) return;
  const p = e.touches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y, now = Date.now();
  if (!sw.drag) {                                         // decide once: sideways swipe, or normal up / down scroll
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.3) { sw = null; return; }
    sw.drag = true; stopDemo(); swPeek(dx < 0 ? -1 : 1);
  }
  if ((dx < 0 ? -1 : 1) !== sw.dir && dx !== 0) swPeek(dx < 0 ? -1 : 1);     // finger went back past the start: show the other neighbour
  if (now > sw.lt) { sw.v = (p.clientX - sw.lx) / (now - sw.lt); sw.lx = p.clientX; sw.lt = now; }
  swMove(sw.to ? dx : dx * .25, false);                   // no page that way: the page resists
  sw.dx = dx;
}, {passive:true});
document.getElementById('pager').addEventListener('touchend', () => {
  if (!sw || !sw.drag) { sw = null; return; }
  const dx = sw.dx || 0, far = Math.abs(dx) > view.offsetWidth * .3, flick = Math.abs(sw.v) > .45 && Math.abs(dx) > 30 && (sw.v < 0) === (dx < 0);
  swEnd(far || flick);
}, {passive:true});
document.getElementById('pager').addEventListener('touchcancel', () => swEnd(false), {passive:true});

/* ---------- zoom: opens with the whole picture visible.
   Pinch, mouse wheel or + / - to zoom. Drag to move. Double tap to zoom in or back out. ---------- */
let lastFocus = null;
const zin = $('#zin'), Z = {s:1, x:0, y:0, max:4, el:null};
function zApply(anim){
  const el = Z.el; if (!el) return;
  if (Z.s <= 1.001) { Z.s = 1; Z.x = 0; Z.y = 0; }
  else {   // keep the picture from leaving the screen
    const mx = Math.max(0, (el.offsetWidth * Z.s - zin.clientWidth) / 2 + 14), my = Math.max(0, (el.offsetHeight * Z.s - zin.clientHeight) / 2 + 14);
    Z.x = Math.max(-mx, Math.min(mx, Z.x)); Z.y = Math.max(-my, Math.min(my, Z.y));
  }
  el.style.transition = anim ? 'transform .28s' : 'none';
  el.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
}
function zFit(){
  const el = Z.el, img = el && el.querySelector('img'); if (!img || !img.naturalWidth) return;
  const gut = (el.classList.contains('gl') ? 30 : 0) + (el.classList.contains('gr') ? 30 : 0);
  const w = Math.max(120, Math.min(zin.clientWidth - 28, (zin.clientHeight - 28) * img.naturalWidth / img.naturalHeight + gut));
  el.style.width = w + 'px';
  Z.max = Math.max(3, img.naturalWidth / Math.max(1, w - gut) * 1.5);
  Z.s = 1; Z.x = 0; Z.y = 0; zApply(false); spreadBadges(zin);
}
function zSet(s, anim){ const k = Math.max(1, Math.min(Z.max, s)) / Z.s; Z.s *= k; Z.x *= k; Z.y *= k; zApply(anim); }

/* first time in this visit: show how to zoom and move the picture, in three slow steps.
   The finger marks and the picture move together: 1 zoom in, 2 move to the right side, 3 zoom out. */
let zHintSeen = false, zRaf = 0;
function hideZHint(){ cancelAnimationFrame(zRaf); zRaf = 0; $('#zhint').hidden = true; }
function showZHint(){
  if (zHintSeen || !Z.el) return;
  zHintSeen = true;
  const touch = matchMedia('(pointer: coarse)').matches, cap = $('#zhtext'), [d1, d2] = $('#zhint').querySelectorAll('.zd');
  const TXT = touch ? ['1. Spread two fingers to zoom in', '2. Drag to move the picture', '3. Pinch to zoom out']
                    : ['1. Scroll to zoom in', '2. Drag to move the picture', '3. Scroll back to zoom out'];
  const S = Math.min(Z.max, 2.2), W = zin.clientWidth;
  const D = Math.min(W * .5, Math.max(0, (Z.el.offsetWidth * S - W) / 2 + 14));     // how far the picture can move left
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const seg = (t, a, b) => t <= a ? 0 : t >= b ? 1 : ease((t - a) / (b - a));
  const dot = (el, x, y, o) => { el.style.opacity = o; el.style.transform = `translate(${x}px,${y}px)`; };
  $('#zhint').hidden = false;
  let t0 = 0;
  function frame(now){
    if (!Z.el) return;
    if (!t0) t0 = now;
    const t = now - t0;
    if (t < 3200) {                                   // 1: two fingers move apart, the picture grows with them
      cap.textContent = TXT[0];
      const p = seg(t, 800, 2700), o = Math.min(seg(t, 0, 500), 1 - seg(t, 2900, 3200)), r = 16 + 58 * p;
      dot(d1, -r, r, touch ? o : 0); dot(d2, r, -r, touch ? o : 0);
      Z.s = 1 + (S - 1) * p; Z.x = 0; Z.y = 0;
    } else if (t < 6400) {                            // 2: one finger moves right to left, the picture follows by the same distance
      cap.textContent = TXT[1];
      const p = seg(t, 4000, 5900), o = Math.min(seg(t, 3200, 3700), 1 - seg(t, 6100, 6400));
      dot(d1, D / 2 - D * p, 0, o); dot(d2, 0, 0, 0);
      Z.s = S; Z.x = -D * p; Z.y = 0;
    } else if (t < 9600) {                            // 3: two fingers move together, the picture shrinks back
      cap.textContent = TXT[2];
      const p = seg(t, 7200, 9100), o = Math.min(seg(t, 6400, 6900), 1 - seg(t, 9300, 9600)), r = 74 - 58 * p;
      dot(d1, -r, r, touch ? o : 0); dot(d2, r, -r, touch ? o : 0);
      Z.s = S - (S - 1) * p; Z.x = -D * (1 - p); Z.y = 0;
    } else { Z.s = 1; Z.x = 0; Z.y = 0; zApply(false); hideZHint(); return; }
    zApply(false);
    zRaf = requestAnimationFrame(frame);
  }
  zRaf = requestAnimationFrame(frame);
}

function openZoom(id){
  const s = STEPS.find(x => x.id === id);
  stopDemo();
  lastFocus = document.activeElement;
  $('#zcode').textContent = 'Screenshot ' + id;
  zin.innerHTML = `<div class="shot${gutters(s.shot, true)}">${shotHTML(s.shot, id, true)}</div>`;
  Z.el = zin.firstElementChild;
  zin.appendChild($('#zhint'));
  $('#zoom').hidden = false; document.body.style.overflow = 'hidden'; $('#zclose').focus();
  watchPics(zin);   // swaps the placeholder for the picture once it has downloaded (was missing: stuck on "loading")
  const img = Z.el.querySelector('img'), ready = () => { zFit(); showZHint(); };
  if (!img || img.complete) ready(); else img.addEventListener('load', ready, {once:true});
}
function closeZoom(){ hideZHint(); document.body.appendChild($('#zhint')); $('#zoom').hidden = true; document.body.style.overflow = ''; zin.innerHTML = ''; Z.el = null; zp.clear(); if (lastFocus) lastFocus.focus(); }
$('#zclose').addEventListener('click', closeZoom);
$('#zplus').addEventListener('click', () => { hideZHint(); zSet(Z.s * 1.6, true); });
$('#zout').addEventListener('click', () => { hideZHint(); zSet(Z.s / 1.6, true); });
window.addEventListener('resize', () => { if (Z.el) zFit(); });

const zp = new Map(); let zg = null, zMoved = false, zTap = 0;
function zStart(){
  const p = [...zp.values()];
  zg = p.length === 2 ? {d:Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, mx:(p[0].x + p[1].x) / 2, my:(p[0].y + p[1].y) / 2, s:Z.s, x:Z.x, y:Z.y}
     : p.length === 1 ? {px:p[0].x, py:p[0].y, x:Z.x, y:Z.y} : null;
}
zin.addEventListener('pointerdown', e => {
  if (!Z.el) return;
  if (!zp.size) zMoved = false;
  zp.set(e.pointerId, {x:e.clientX, y:e.clientY}); try { zin.setPointerCapture(e.pointerId); } catch(err) {}
  hideZHint(); zStart();
});
zin.addEventListener('pointermove', e => {
  if (!zp.has(e.pointerId) || !zg) return;
  zp.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = [...zp.values()];
  if (p.length === 2) {                                   // pinch: scale, and follow the middle of the two fingers
    const s = Math.max(1, Math.min(Z.max, zg.s * Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) / zg.d)), k = s / zg.s;
    Z.s = s; Z.x = zg.x * k + (p[0].x + p[1].x) / 2 - zg.mx; Z.y = zg.y * k + (p[0].y + p[1].y) / 2 - zg.my;
    zMoved = true; zApply(false);
  } else if (p.length === 1) {                            // drag
    const dx = p[0].x - zg.px, dy = p[0].y - zg.py;
    if (Math.hypot(dx, dy) > 6) zMoved = true;
    if (Z.s > 1) { Z.x = zg.x + dx; Z.y = zg.y + dy; zApply(false); }
  }
});
function zEnd(e){
  if (!zp.delete(e.pointerId)) return;
  zStart();
  if (zp.size || zMoved || !Z.el) return;
  // a tap: outside the picture closes; twice on the picture zooms in or back out
  const r = Z.el.getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) { closeZoom(); return; }
  const now = Date.now();
  if (now - zTap < 320) { zSet(Z.s > 1.05 ? 1 : Math.min(Z.max, 2.5), true); zTap = 0; } else zTap = now;
}
zin.addEventListener('pointerup', zEnd);
zin.addEventListener('pointercancel', zEnd);
zin.addEventListener('wheel', e => { if (!Z.el) return; e.preventDefault(); hideZHint(); zSet(Z.s * Math.exp(-e.deltaY * 0.0022), false); }, {passive:false});

/* ---------- keyboard: Esc closes zoom, left / right arrows change step ---------- */
document.addEventListener('keydown', e => {
  const zoomOpen = !$('#zoom').hidden;
  if (e.key === 'Escape' && zoomOpen) { closeZoom(); return; }
  if (zoomOpen || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (current === 'start' && e.key === 'ArrowRight') { e.preventDefault(); go('A1'); return; }   // same as a swipe: first time
  const {prev, next} = neighbours(current);
  const to = e.key === 'ArrowRight' ? next : prev;
  if (to) { e.preventDefault(); go(to); }
});

/* ---------- theme (icon shows the mode you switch to) ---------- */
const moon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
const sun = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>';
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function paintTheme(){ const d = isDark(); $('#themeBtn').innerHTML = d ? sun : moon; $('#themeBtn').setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); }
$('#themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; paintTheme(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);

// crossing the phone / wide boundary (rotate, resize): draw the current step again with the other picture
NARROW.addEventListener('change', () => { if (current && $('#zoom').hidden) render(current); });

buildStrip(); paintTheme();
render(location.hash.slice(1) || 'start');
syncArrows(); hintStrip();
})();
</script>
