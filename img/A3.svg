<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <!-- Drawn example, not a real Xero screen -->
  <rect width="800" height="500" fill="#F2F5F8"/>
  <rect width="800" height="44" fill="#1F4FD8"/>
  <text x="24" y="29" fill="#fff" font-size="20" font-weight="700">xero</text>
  <rect x="92" y="10" width="250" height="24" rx="4" fill="#2C5EE6"/>
  <text x="104" y="27" fill="#fff" font-size="14">Matrix Traffic and Transport Data</text>

  <text x="60" y="88" fill="#141B3C" font-size="24" font-weight="700">Set up your employee file</text>

  <!-- step tabs -->
  <g font-size="14" font-weight="700">
    <rect x="60" y="108" width="160" height="40" rx="6" fill="#1F4FD8"/>
    <text x="140" y="133" fill="#fff" text-anchor="middle">1  Personal details</text>
    <rect x="228" y="108" width="160" height="40" rx="6" fill="#fff" stroke="#D4DAE3"/>
    <text x="308" y="133" fill="#5B6078" text-anchor="middle">2  Tax details</text>
    <rect x="396" y="108" width="160" height="40" rx="6" fill="#fff" stroke="#D4DAE3"/>
    <text x="476" y="133" fill="#5B6078" text-anchor="middle">3  Superannuation</text>
    <rect x="564" y="108" width="176" height="40" rx="6" fill="#fff" stroke="#D4DAE3"/>
    <text x="652" y="133" fill="#5B6078" text-anchor="middle">4  Bank details</text>
  </g>

  <!-- form card -->
  <rect x="60" y="166" width="680" height="280" rx="8" fill="#fff" stroke="#D4DAE3"/>
  <g font-size="14" fill="#141B3C">
    <text x="88" y="200">Home address</text>
    <rect x="88" y="210" width="624" height="34" rx="4" fill="#fff" stroke="#B8C2D0"/>
    <text x="88" y="276">Mobile number</text>
    <rect x="88" y="286" width="300" height="34" rx="4" fill="#fff" stroke="#B8C2D0"/>
    <text x="412" y="276">Date of birth</text>
    <rect x="412" y="286" width="300" height="34" rx="4" fill="#fff" stroke="#B8C2D0"/>
    <text x="88" y="352">Emergency contact</text>
    <rect x="88" y="362" width="624" height="34" rx="4" fill="#fff" stroke="#B8C2D0"/>
  </g>
  <rect x="612" y="408" width="100" height="28" rx="4" fill="#3E9B3A"/>
  <text x="662" y="427" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Next</text>

  <!-- what each step needs -->
  <g font-size="13" fill="#5B6078">
    <text x="60" y="476">You will need:  Tax File Number  ·  super fund and member number  ·  bank BSB and account number</text>
  </g>
</svg>
